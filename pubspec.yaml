name: iconschange
description: "Icon Atelier App"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  package_info_plus: ^8.0.0
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2 # 👈 غيرت من 0.19.0 إلى 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Icon Graphic (Intentional Asymmetry & Layering).png"
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/images/Icon Graphic (Intentional Asymmetry & Layering).png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
